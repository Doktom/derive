<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dérive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <aside id="left">
      <div id="resources"></div>
      <div id="hint"></div>
    </aside>
    <main id="center">
      <canvas id="map"></canvas>
      <div id="toasts"></div>
      <div id="tic"><div class="tic-bird" aria-hidden="true"></div><div class="tic-text"></div></div>
      <div id="botbar" class="hidden">Mode Bot actif <button class="btn sm" data-action="bot">Reprendre la main</button></div>
      <div id="cine"></div>
    </main>
    <aside id="right">
      <nav id="tabs"></nav>
      <div id="panel"></div>
      <div id="selection" class="hidden"></div>
    </aside>
  </div>
  <div id="modal-root"></div>
  <div id="tooltip"></div>

  <!-- Scripts classiques (sans module) : le jeu fonctionne aussi en ouvrant index.html directement. -->
  <script src="js/core/util.js"></script>
  <script src="js/data/resources.js"></script>
  <script src="js/data/buildings.js"></script>
  <script src="js/data/progression.js"></script>
  <script src="js/data/lore.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/core/mods.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/beast.js"></script>
  <script src="js/core/route.js"></script>
  <script src="js/core/world.js"></script>
  <script src="js/core/economy.js"></script>
  <script src="js/core/logistics.js"></script>
  <script src="js/core/defense.js"></script>
  <script src="js/core/logic.js"></script>
  <script src="js/core/bot.js"></script>
  <script src="js/ui/lore.js"></script>
  <script src="js/ui/render.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
